# Coral site — nginx reverse-proxies everything to the Node CMS (port 3000).
# The Node app renders the public page (Service/Works/Recruit from the CMS),
# serves /assets, and hosts /admin. Replace the old static-file server block with this.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10m;   # allow image uploads

    # Static assets straight from disk (fast path; Node also can serve them)
    location /assets/ {
        root /var/www/coral;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @app;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    # --- Optional interim protection for the admin until HTTPS is set up ---
    # location /admin {
    #     allow YOUR.IP.ADDRESS.HERE;
    #     deny all;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_set_header Host $host;
    # }
}
